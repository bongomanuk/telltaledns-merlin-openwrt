# TelltaleDNS config for a manual install under /jffs (no Entware).
# Check edits with: /jffs/telltale/telltale config check /jffs/telltale/telltale.toml
#
# Safe mode: dnsmasq keeps port 53, so DHCP, local names, router.asus.com and the
# AiMesh nodes keep working even if TelltaleDNS stops. dnsmasq forwards public
# queries here on 127.0.0.1:5354 (see install.sh).
config_version = 1

[node]
# Two UDP workers are enough for a home network and keep the RSS down.
workers = 2
# The data lives in data_dir. The installer points it at a mounted USB volume
# when there is one, and at /jffs/telltale/data otherwise: the query log and the
# state database are written constantly and the internal flash wears out. The
# binary in this bundle is gzip-compressed (about 15 MB instead of 35 MB) and is
# unpacked to /tmp at start.
data_dir = "/jffs/telltale/data"

# The web UI and API (the UI is embedded in the binary).
[api]
listen = "0.0.0.0:8053"

# Only dnsmasq talks to this listener. Never bind port 53 here: dnsmasq keeps
# port 53 so the LAN keeps resolving when this process is down.
[[listen]]
proto = "udp"
addr = "127.0.0.1:5354"

[[listen]]
proto = "tcp"
addr = "127.0.0.1:5354"

# Encrypted (DNS over TLS) upstreams. The Mozilla roots are built into the
# binary, so no CA bundle is needed on the router.
[[upstream]]
name = "cloudflare"
url = "tls://1.1.1.1:853"
tls_server_name = "cloudflare-dns.com"

[[upstream]]
name = "quad9"
url = "tls://9.9.9.9:853"
tls_server_name = "dns.quad9.net"

[[upstream_group]]
name = "default"
members = ["cloudflare", "quad9"]
strategy = "fastest"

# Device names from the router's DHCP leases. Asuswrt-Merlin keeps the file at
# /var/lib/misc/dnsmasq.leases; OpenWrt at /tmp/dhcp.leases.
[[router]]
name = "dnsmasq"
type = "dnsmasq"
url = "file:///var/lib/misc/dnsmasq.leases"
interval_secs = 60

# A refresh compiles a new snapshot while the old one keeps answering. That
# briefly needs more RAM than a 512 MB router has spare. Keep the sort budget at
# the lowest value the resolver accepts so entries spill to the snapshot
# directory instead of pushing the router into the OOM killer. The refresh is a
# little slower on a USB stick; the LAN stays up.
[filter]
compile_memory = "16MiB"

# A compact blocklist (about 2 MB) rather than the 150k-name list, to leave
# room for the binary and the data directory on a small JFFS partition.
[[list]]
name = "hagezi-light"
url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/light.txt"

# Keep the query log small; the router writes to flash.
[telemetry.qlog]
retention_days = 2
retention_bytes = "4MiB"

# Keep the response cache bounded on a 512 MB router.
[cache]
max_bytes = "16MiB"


# Recover the client from dnsmasq's EDNS MAC option. Without it every query
# arrives from 127.0.0.1, and per-device statistics and rules see the router
# instead of the device. dnsmasq needs `add-mac` (the installer adds it).
[clients]
neighbor_table = true
trust_edns_mac_from = ["127.0.0.1/32"]

# The dashboard's Lockdown switch: blocks these groups right now for this many
# minutes. Empty groups means every group. Quick allow rules still work, and a
# reboot clears the switch.
[lockdown]
groups = []
minutes = 60
