# TelltaleDNS starter config for Entware/Asuswrt-Merlin.
# Check edits with: /opt/sbin/telltale config check /opt/etc/telltale/telltale.toml
config_version = 1

[node]
# Two UDP workers are enough for a home network and keep the RSS down.
workers = 2
# On the Entware USB drive, not the router's flash.
data_dir = "/opt/var/lib/telltale"

# The web UI and API (the UI is embedded in the binary).
[api]
listen = "0.0.0.0:8053"

# Encrypted (DNS over TLS) upstreams. The Mozilla roots are built into the
# binary, so no CA bundle is needed on the router.
[[upstream]]
name = "cloudflare"
url = "tls://1.1.1.1:853"
tls_server_name = "cloudflare-dns.com"

[[upstream]]
name = "quad9"
url = "tls://9.9.9.9:853"
tls_server_name = "dns.quad9.net"

[[upstream_group]]
name = "default"
members = ["cloudflare", "quad9"]
strategy = "fastest"

# The router's own dnsmasq stays on 127.0.0.1:5353 (see the install guide). Local names
# and reverse lookups go there, so DHCP hostnames, home.lan and router.asus.com keep
# working; everything else uses the encrypted upstreams above.
[[upstream]]
name = "router-dns"
url = "udp://127.0.0.1:5353"

[[upstream_group]]
name = "router"
members = ["router-dns"]

[[route]]
match_suffix = ["home.lan", "lan", "router.asus.com", "168.192.in-addr.arpa"]
upstream_group = "router"
dnssec_nta = true

# Device names from the router's DHCP leases. Asuswrt-Merlin keeps the file at
# /var/lib/misc/dnsmasq.leases; OpenWrt at /tmp/dhcp.leases.
[[router]]
name = "dnsmasq"
type = "dnsmasq"
url = "file:///var/lib/misc/dnsmasq.leases"
interval_secs = 60

# A balanced ad and tracker blocklist (about 150k names), refreshed daily.
[[list]]
name = "hagezi-pro"
url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt"

# Keep the query log small on a router.
[telemetry.qlog]
retention_days = 7

# Keep the response cache bounded on a 512 MB router.
[cache]
max_bytes = "16MiB"
