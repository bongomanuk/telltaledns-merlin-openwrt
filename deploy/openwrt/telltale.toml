# TelltaleDNS starter config for OpenWrt.
# Check edits with: /usr/bin/telltale config check /etc/telltale/telltale.toml
config_version = 1

[node]
# Two UDP workers are enough for a home network and keep the RSS down.
workers = 2
# Persistent (flash) on OpenWrt; point this at a USB mount if you prefer.
data_dir = "/etc/telltale/data"

# The web UI and API (the UI is embedded in the binary).
[api]
listen = "0.0.0.0:8053"

# Only dnsmasq talks to this listener. dnsmasq keeps port 53 and the local
# names, so the LAN keeps resolving when this process is down.
[[listen]]
proto = "udp"
addr = "127.0.0.1:5354"

[[listen]]
proto = "tcp"
addr = "127.0.0.1:5354"

# Encrypted (DNS over TLS) upstreams. The Mozilla roots are built into the
# binary, so no CA bundle is needed on the router.
[[upstream]]
name = "cloudflare"
url = "tls://1.1.1.1:853"
tls_server_name = "cloudflare-dns.com"

[[upstream]]
name = "quad9"
url = "tls://9.9.9.9:853"
tls_server_name = "dns.quad9.net"

[[upstream_group]]
name = "default"
members = ["cloudflare", "quad9"]
strategy = "fastest"

# Device names from the router's DHCP leases. Asuswrt-Merlin keeps the file at
# /var/lib/misc/dnsmasq.leases; OpenWrt at /tmp/dhcp.leases.
[[router]]
name = "dnsmasq"
type = "dnsmasq"
url = "file:///tmp/dhcp.leases"
interval_secs = 60

# A balanced ad and tracker blocklist (about 150k names), refreshed daily.
[[list]]
name = "hagezi-pro"
url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt"

# Keep the query log small so it does not fill the router's flash.
[telemetry.qlog]
retention_days = 7
retention_bytes = "16MiB"

# Keep the response cache bounded on a 512 MB router.
[cache]
max_bytes = "16MiB"


# Recover the client from dnsmasq's EDNS MAC option. Without it every query
# arrives from 127.0.0.1, and per-device statistics and rules see the router
# instead of the device. dnsmasq needs `add-mac` (the installer adds it).
[clients]
neighbor_table = true
trust_edns_mac_from = ["127.0.0.1/32"]
