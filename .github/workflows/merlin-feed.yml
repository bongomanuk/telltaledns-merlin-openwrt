# Build and publish the packages for ASUS Merlin (Entware/opkg) and OpenWrt
# 25.12+ (apk v3), and host them on GitHub Pages.
#
#   Entware feed:  https://bongomanuk.github.io/telltaledns-merlin-openwrt/entware
#   OpenWrt files: https://bongomanuk.github.io/telltaledns-merlin-openwrt/openwrt
#
# The binaries come from the reusable merlin-binaries workflow. This workflow
# packages them, writes the Entware index, publishes the Pages site, and (when
# building an upstream release) creates the release that marks it as built.
#
# Run it from Actions -> merlin-feed -> Run workflow. The upstream-watch
# workflow dispatches it for each new release of paimonsoror/telltaledns.
name: merlin-feed

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to build (e.g. v0.7.0); empty builds this fork."
        type: string
        required: false
        default: ""
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/merlin-binaries.yml
    with:
      source_repository: ${{ inputs.upstream_tag != '' && 'paimonsoror/telltaledns' || '' }}
      source_ref: ${{ inputs.upstream_tag }}
      version: ${{ inputs.upstream_tag }}

  feed:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: telltale-merlin-${{ github.run_number }}
          path: bin

      - name: Work out the versions
        shell: bash
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "${UPSTREAM_TAG}" ]]; then
            version="${UPSTREAM_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${pkg}-merlin.${GITHUB_RUN_NUMBER}"
          fi
          # apk version strings are stricter than opkg's: X.Y.Z or X.Y.Z-rN.
          base_version="${version%%-merlin.*}"
          apk_version="${base_version}-r${GITHUB_RUN_NUMBER}"
          pkg_version="${version}-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_VERSION=$apk_version" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$pkg_version" >> "$GITHUB_ENV"
          echo "Upstream tag: ${UPSTREAM_TAG:-none}; version $version; ipk $pkg_version; apk $apk_version"

      - name: Build the Entware/opkg packages and index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/entware
          chmod +x deploy/merlin/opkg/build-ipk.sh
          deploy/merlin/opkg/build-ipk.sh \
            bin/telltale-armv7-linux armv7-3.2 "$PKG_VERSION" public/entware
          deploy/merlin/opkg/build-ipk.sh \
            bin/telltale-aarch64-linux aarch64-3.10 "$PKG_VERSION" public/entware
          cp bin/SHA256SUMS public/entware/SHA256SUMS
          python3 deploy/merlin/opkg/make_index.py public/entware
          cat public/entware/Packages

      - name: Install zstd (the OpenWrt SDK is a .tar.zst)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Cache the OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: openwrt-sdk
          key: openwrt-sdk-25.12.6-x86-64

      - name: Get the OpenWrt 25.12 SDK (for apk v3)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x openwrt-sdk/staging_dir/host/bin/apk ]]; then
            url='https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
            curl -fsSLo sdk.tar.zst "$url"
            tar --zstd -xf sdk.tar.zst
            mv openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64 openwrt-sdk
            rm sdk.tar.zst
          fi
          openwrt-sdk/staging_dir/host/bin/apk --version

      - name: Build the OpenWrt 25.12+ apk packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/openwrt
          chmod +x deploy/openwrt/build-apk.sh
          apk=openwrt-sdk/staging_dir/host/bin/apk
          build() {
            # root owns the packaged files; ci runs with passwordless sudo.
            sudo env SOURCE_DATE_EPOCH=0 deploy/openwrt/build-apk.sh \
              "$apk" "$1" "$2" "$APK_VERSION" public/openwrt
          }
          build bin/telltale-armv7-linux  arm_cortex-a7_neon-vfpv4
          build bin/telltale-armv7-linux  arm_cortex-a15_neon-vfpv4
          build bin/telltale-aarch64-linux aarch64_cortex-a53
          build bin/telltale-aarch64-linux aarch64_cortex-a72
          build bin/telltale-aarch64-linux aarch64_generic
          build bin/telltale-x86_64-linux  x86_64
          {
            echo '<!doctype html><meta charset="utf-8"><title>TelltaleDNS for OpenWrt</title>'
            echo '<h1>TelltaleDNS for OpenWrt 25.12+</h1><ul>'
            for f in public/openwrt/*.apk; do
              b=$(basename "$f")
              echo "<li><a href=\"$b\">$b</a></li>"
            done
            echo '</ul>'
          } > public/openwrt/index.html

      - name: Build the Merlin bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/merlin
          chmod +x deploy/merlin/jffs/install.sh
          for arch in armv7 aarch64; do
            stage=$(mktemp -d)
            gzip -9 -n -c "bin/telltale-${arch}-linux" > "$stage/telltale.gz"
            cp deploy/merlin/jffs/install.sh deploy/merlin/jffs/telltale.toml "$stage/"
            tar -C "$stage" -czf "public/merlin/telltale-${VERSION}-merlin-${arch}.tar.gz" .
            rm -rf "$stage"
          done
          {
            echo '<!doctype html><meta charset="utf-8"><title>TelltaleDNS Merlin bundles</title>'
            echo '<h1>TelltaleDNS for ASUS Merlin</h1>'
            echo '<p>Extract the bundle on the router and run <code>./install.sh</code>. The binary is gzip-compressed to save flash.</p><ul>'
            for f in public/merlin/*.tar.gz; do
              b=$(basename "$f")
              echo "<li><a href=\"$b\">$b</a></li>"
            done
            echo '</ul>'
          } > public/merlin/index.html

      - name: Landing page
        shell: bash
        run: |
          cat > public/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>TelltaleDNS for routers</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem}code{background:#eee;padding:.1em .3em;border-radius:3px}pre{background:#f4f4f4;padding:1rem;overflow:auto}</style>
          <h1>TelltaleDNS for routers</h1>
          <p>Static builds of <a href="https://github.com/paimonsoror/telltaledns">TelltaleDNS</a>.
          Latest build: <strong>${VERSION}</strong>.</p>
          <h2>ASUS Merlin / Entware (opkg)</h2>
          <pre><code>echo 'src/gz telltale https://bongomanuk.github.io/telltaledns-merlin-openwrt/entware' &gt;&gt; /opt/etc/opkg/customfeeds.conf
          opkg update
          opkg install telltale</code></pre>
          <p><a href="entware/Packages">Packages</a> · <a href="entware/Packages.gz">Packages.gz</a></p>
          <h2>OpenWrt 25.12+ (apk v3)</h2>
          <p>Pick the package for <code>apk --print-arch</code>, then install it:</p>
          <pre><code>apk add --allow-untrusted ./telltale-${APK_VERSION}-&lt;arch&gt;.apk</code></pre>
          <p><a href="openwrt/">OpenWrt packages</a></p>
          <h2>ASUS Merlin without Entware</h2>
          <p>Use the bundle: a gzip-compressed binary (about 14 MB on flash) and an installer.</p>
          <p><a href="merlin/">Merlin bundles</a></p>
          HTML

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Publish the release for the upstream tag
        if: inputs.upstream_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upstream_tag != '' && inputs.upstream_tag || github.ref_name }}
          name: TelltaleDNS ${{ inputs.upstream_tag != '' && inputs.upstream_tag || github.ref_name }} for Merlin and OpenWrt
          body: |
            Built from `${{ inputs.upstream_tag != '' && inputs.upstream_tag || github.ref_name }}`.

            - **ASUS Merlin / Entware:** add `src/gz telltale https://bongomanuk.github.io/telltaledns-merlin-openwrt/entware`
              to `/opt/etc/opkg/customfeeds.conf`, then `opkg update && opkg install telltale`.
            - **ASUS Merlin without Entware:** download the `-merlin-armv7.tar.gz`
              (or `-aarch64`) bundle and run `./install.sh`.
            - **OpenWrt 25.12+:** download the `.apk` for `apk --print-arch` and
              `apk add --allow-untrusted ./telltale-*.apk`.

            The same files are on <https://bongomanuk.github.io/telltaledns-merlin-openwrt/>.
          files: |
            public/entware/*.ipk
            public/entware/Packages
            public/entware/Packages.gz
            public/openwrt/*.apk
            public/merlin/*.tar.gz
            bin/telltale-armv7-linux
            bin/telltale-aarch64-linux
            bin/telltale-x86_64-linux
            bin/SHA256SUMS
          fail_on_unmatched_files: true
