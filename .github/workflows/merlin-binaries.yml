# Build the static TelltaleDNS binaries for ASUS Merlin and OpenWrt, on GitHub.
#
# Asuswrt-Merlin runs on Broadcom HND hardware:
#   * ARMv7 (32-bit), e.g. ZenWiFi XT8 / RT-AX95Q, RT-AX58U, RT-AX82U, RT-AX92U
#   * ARM64 (aarch64), newer HND models (RT-AX86U, RT-AX88U, GT-AX11000, ...)
# The binaries are static musl builds, so they need no Entware/uclibc on the router.
#
# Each architecture builds on its own runner in parallel; the bundle job combines
# them into one artifact (and a release on a v* tag).
name: merlin-binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_repository:
        description: "Repository to build (default: this fork). Used to build an upstream release."
        type: string
        required: false
        default: ""
      source_ref:
        description: "Git ref in source_repository (a tag, branch, or SHA)."
        type: string
        required: false
        default: ""
      version:
        description: "Version to stamp into the binary (default: derived from the ref)."
        type: string
        required: false
        default: ""
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            name: armv7
            cflags: ""
          - target: aarch64-unknown-linux-musl
            name: aarch64
            cflags: ""
          - target: x86_64-unknown-linux-musl
            name: x86_64
            cflags: ""
          - target: i686-unknown-linux-musl
            name: i686
            cflags: "-mevex512"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CFLAGS: ${{ matrix.cflags }}
      CFLAGS_i686_unknown_linux_musl: ${{ matrix.cflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository != '' && inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      - name: Rust 1.99.0 with the musl target
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: merlin-${{ matrix.name }}

      - name: Node (the web UI is embedded in the binary)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the web UI
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Zig and cargo-zigbuild (pinned, checksum-verified)
        run: |
          set -eu
          ZIG_VERSION=0.15.2
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

          curl -fsSLo "$RUNNER_TEMP/zb.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b  $RUNNER_TEMP/zb.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zb.tar.xz" -C "$HOME/.cargo/bin" --strip-components=1

          "$HOME/.local/zig/zig" version
          cargo-zigbuild --version

      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "${VERSION_INPUT}" ]]; then
            version="${VERSION_INPUT#v}"
            channel=stable
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel=stable
          else
            version="${pkg}-merlin.${GITHUB_RUN_NUMBER}"
            channel=merlin
          fi
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          export TELLTALE_BUILD_VERSION="$version"
          export TELLTALE_BUILD_CHANNEL="$channel"
          export TELLTALE_BUILD_DATE="$date"
          export TELLTALE_BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"

          cargo +1.99.0 zigbuild --locked --release -p telltale --target "${{ matrix.target }}"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/telltale" "dist/telltale-${{ matrix.name }}-linux"
          chmod 755 dist/*
          ./dist/telltale-${{ matrix.name }}-linux --version

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: telltale-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every architecture
        uses: actions/download-artifact@v4
        with:
          pattern: telltale-*
          merge-multiple: true
          path: dist

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 dist/*
          ./dist/telltale-x86_64-linux --version
          (cd dist && sha256sum telltale-* > SHA256SUMS && cat SHA256SUMS)

      - name: Upload the combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: telltale-merlin-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
