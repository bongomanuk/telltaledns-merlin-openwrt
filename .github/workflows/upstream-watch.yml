# Keep this fork current and build each upstream release.
#
# Daily (or on demand):
#   1. merge paimonsoror/telltaledns main into this fork's main, keeping this
#      fork's README, workflows and packaging files on conflicts;
#   2. look at the latest upstream release; if this fork has no release for that
#      tag yet, dispatch merlin-feed for the tag, which builds this fork's main
#      (upstream merged in, fork integration on top), publishes the Merlin/Entware and OpenWrt packages, and creates the release.
name: upstream-watch

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/paimonsoror/telltaledns.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main is already up to date with upstream"
            exit 0
          fi
          # -X ours: where upstream and this fork disagree (README, the Merlin and
          # OpenWrt packaging, the fork's workflows), keep this fork's version.
          # Everything else, including new upstream files and source changes, is
          # taken as upstream has it.
          git merge --no-edit -X ours upstream/main
          git push origin main
          echo "Merged upstream main into this fork"

      - name: Latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/paimonsoror/telltaledns/releases/latest --jq .tag_name)
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "No upstream release found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $tag"

      - name: Already built?
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.latest.outputs.tag }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Already built ${{ steps.latest.outputs.tag }}"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Not built yet: ${{ steps.latest.outputs.tag }}"
          fi

      - name: Build the release
        if: steps.built.outputs.built == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          gh workflow run merlin-feed.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f upstream_tag="$TAG"
          echo "Dispatched merlin-feed for $TAG"
